      that also serve as the runtime fallback before React's useSEO hook runs.
    -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aarvak Diagnostics" />

    <meta property="og:description" content="Pathology, radiology & health checkup services in Gurugram with home sample collection and fast, accurate reports. NABL protocols followed; certification application submitted." />
    <meta property="og:url" content="https://www.aarvakdiagnostics.com" />
    <meta property="og:image" content="https://www.aarvakdiagnostics.com/images/aarvak-logo.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-D3YFX0YMKB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-D3YFX0YMKB');
    </script>
  </head>
